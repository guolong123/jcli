name: credential
description: Manage Jenkins credentials
methods:
  list:
    description: List credentials in a store/domain
    http:
      method: GET
      path: "credentials/store/{{ store }}/domain/{{ domain }}/api/json"
    params:
      path:
        - name: store
          type: string
          default: system
        - name: domain
          type: string
          default: "_"
      query:
        - name: depth
          type: int
    output:
      items_path: $.credentials
      fields:
        - name: id
          alias: ID
        - name: description
          alias: Description
        - name: typeName
          alias: Type
  get:
    description: Get credential details
    http:
      method: GET
      path: "credentials/store/{{ store }}/domain/_/credential/{{ cred_id }}/api/json"
    params:
      path:
        - name: cred_id
          type: string
          argument: true
        - name: store
          type: string
          default: system
  create:
    description: Create a credential from XML config
    http:
      method: POST
      path: "credentials/store/{{ store }}/domain/{{ domain }}/createCredentials"
      headers:
        Content-Type: application/xml
      body: "{{ xml_data }}"
    params:
      path:
        - name: store
          type: string
          default: system
        - name: domain
          type: string
          default: "_"
      body:
        - name: xml_data
          type: file
          argument: true
  update:
    description: Update an existing credential
    http:
      method: POST
      path: "credentials/store/{{ store }}/domain/_/credential/{{ cred_id }}/updateCredentials"
      headers:
        Content-Type: application/xml
      body: "{{ xml_data }}"
    params:
      path:
        - name: cred_id
          type: string
          argument: true
        - name: store
          type: string
          default: system
      body:
        - name: xml_data
          type: file
          argument: true
  delete:
    description: Delete a credential
    http:
      method: POST
      path: "credentials/store/{{ store }}/domain/{{ domain }}/credential/{{ cred_id }}/doDelete"
    params:
      path:
        - name: cred_id
          type: string
          argument: true
        - name: store
          type: string
          default: system
        - name: domain
          type: string
          default: "_"