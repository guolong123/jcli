[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jencli"
version = "0.1.0"
description = "Python Jenkins CLI tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1.0",
    "requests~=2.31.0",
    "pyyaml~=6.0.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23.0",
]

[project.scripts]
jcli = "jcli.cli:main"

[tool.setuptools.packages.find]
include = ["jcli*"]

[tool.setuptools.package-data]
"jcli" = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
